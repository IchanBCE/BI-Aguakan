<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma de Dashboards · Aguakan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     FASE 2 — index.html manual (estilo Aguakan)
     Paleta y tipografía tomadas del diseño que compartiste
     ("Proyectos Aguakan"). Sigue siendo una lista escrita a mano:
     para agregar un dashboard nuevo, copia un <a class="row">
     dentro de su categoría y ajusta el link y el título.
     Para agregar un mes nuevo, copia el <button class="tab"> y
     su <div class="panel"> correspondiente (ver comentarios abajo).
     ============================================================ */

  :root{
    --navy-dark:   #0A1E4A;
    --navy-mid:    #1650B9;
    --blue-bright: #1F7FD1;
    --cyan:        #5EEAFB;
    --cyan-soft:   #8FF3FF;
    --teal:        #14B8A6;

    --panel-bg:    #F1F5F9;
    --text-dark:   #0F2A43;
    --text-muted:  #7C8CA0;
    --border:      #E2E9F0;

    --cat-zonas:     #2E86AB;
    --cat-saldos:    #06A77D;
    --cat-convenios: #E08E45;
    --cat-varios:    #7C6FF0;

    --font-display: 'Archivo Black', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    font-family: var(--font-body);
    background: var(--panel-bg);
    color: var(--text-dark);
    -webkit-font-smoothing: antialiased;
  }

  a{ text-decoration:none; color:inherit; }

  @keyframes float{
    0%   { transform: translateY(0px); }
    50%  { transform: translateY(-16px); }
    100% { transform: translateY(0px); }
  }

  /* ---------- HERO ---------- */

  header.hero{
    position: relative;
    overflow: hidden;
    padding: 40px 32px 120px;
    background:
      radial-gradient(circle at 85% 15%, rgba(255,255,255,0.10), transparent 40%),
      linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-mid) 55%, var(--blue-bright) 100%);
    color: #fff;
  }

  .hero-top{
    max-width: 1180px;
    margin: 0 auto 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 2;
  }

  .logo{
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo svg{ width: 34px; height: 34px; }

  .logo-text{
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: 0.04em;
    color: #cfe8ff;
  }

  .btn-pill{
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    background: linear-gradient(90deg, var(--teal), var(--blue-bright));
    padding: 12px 22px;
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(20,184,166,0.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .btn-pill:hover{
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(20,184,166,0.45);
  }

  .btn-stack{
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .btn-pill.secondary{
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: none;
  }

  .btn-pill.secondary:hover{
    background: rgba(255,255,255,0.16);
    box-shadow: none;
  }

  .hero-body{
    max-width: 1180px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }

  h1.headline{
    font-family: var(--font-display);
    line-height: 0.98;
    margin: 0;
    font-size: clamp(38px, 6vw, 68px);
    letter-spacing: -0.01em;
  }

  h1.headline .line1{ color: #fff; display:block; }
  h1.headline .line2{
    display:block;
    background: linear-gradient(90deg, var(--cyan), var(--cyan-soft));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.sub{
    font-size: 15px;
    color: rgba(255,255,255,0.75);
    margin: 18px 0 0;
    max-width: 480px;
    font-weight: 500;
  }

  .by-line{
    position: absolute;
    right: 0;
    bottom: -8px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
  }

  /* ---------- Estadísticas generales (Fase 5) ---------- */
  .stats{
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    margin-top: 26px;
    font-family: var(--font-mono);
  }

  .stats .stat b{
    display: block;
    font-size: 24px;
    font-weight: 500;
    color: #fff;
  }

  .stats .stat span{
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  /* decoraciones flotantes: gotas y burbujas */
  .deco{ position:absolute; z-index:1; pointer-events:none; }

  .drop{
    width: 26px; height: 34px;
    background: linear-gradient(160deg, #ffffff, #cfe3f5 70%);
    border-radius: 50% 50% 50% 0;
    transform: rotate(45deg);
    opacity: 0.9;
    animation: float 5s ease-in-out infinite;
  }

  .bubble{
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #ffffff, #8fd9f2 45%, #2f8fc7 100%);
    animation: float 6s ease-in-out infinite;
  }

  .d1{ top: 70px;  left: 6%;   animation-delay: .2s; }
  .d2{ top: 30px;  right: 14%; animation-delay: 1.2s; width:18px; height:24px; }
  .b1{ top: 110px; right: 22%; width: 46px; height:46px; animation-delay: .6s; }
  .b2{ top: 210px; right: 6%;  width: 108px; height:108px; animation-delay: 0s; }

  /* ---------- PANEL / TABS ---------- */

  main.panel{
    max-width: 1180px;
    margin: -80px auto 0;
    background: #fff;
    border-radius: 28px 28px 0 0;
    padding: 44px 40px 20px;
    position: relative;
    z-index: 3;
    box-shadow: 0 -20px 40px rgba(10,30,74,0.08);
  }

  /* Selector de mes: un dropdown en vez de una fila de pestañas,
     para que siga viéndose bien aunque haya 12+ meses acumulados. */
  .month-select-wrap{
    display:flex;
    align-items:center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
    margin-bottom: 32px;
  }

  .month-select-wrap .mes-grupo{
    display:flex;
    align-items:center;
    gap: 12px;
  }

  .month-select-wrap .label{
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  /* ---------- Buscador (Fase 5) ---------- */
  .search-wrap{
    position: relative;
    flex: 1;
    min-width: 220px;
    max-width: 320px;
  }

  .search-wrap svg{
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    color: var(--text-muted);
    pointer-events: none;
  }

  input.search-input{
    width: 100%;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text-dark);
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px 10px 38px;
    transition: border-color .12s ease, box-shadow .12s ease;
  }

  input.search-input:focus{
    outline: none;
    border-color: var(--blue-bright);
    box-shadow: 0 0 0 3px rgba(31,127,209,0.15);
  }

  input.search-input::placeholder{ color: var(--text-muted); }

  .search-info{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    margin: -16px 0 24px;
  }

  select.month-select{
    appearance: none;
    -webkit-appearance: none;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 15px;
    color: var(--text-dark);
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 42px 10px 16px;
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%237C8CA0' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 16px center;
    transition: border-color .12s ease, box-shadow .12s ease;
  }

  select.month-select:hover,
  select.month-select:focus{
    border-color: var(--blue-bright);
    outline: none;
    box-shadow: 0 0 0 3px rgba(31,127,209,0.15);
  }

  .month-panel{ display:none; }
  .month-panel.active{ display:block; }

  .cat-block{ margin-bottom: 34px; }

  .cat-heading{
    display:flex;
    align-items:center;
    gap:10px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 14px;
  }

  .cat-heading .dot{
    width:9px; height:9px;
    border-radius:50%;
  }

  .cat-heading .count{
    margin-left: auto;
    color: var(--text-muted);
    font-weight: 500;
  }

  .row{
    display:flex;
    align-items:center;
    gap:16px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 10px;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  }

  .row:hover{
    background: #fff;
    transform: translateX(4px);
    box-shadow: 0 8px 20px rgba(10,30,74,0.08);
  }

  .row .bullet{
    width: 14px; height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 4px rgba(0,0,0,0.03);
  }

  .row .row-text{ flex: 1; }

  .row .row-title{
    font-weight: 600;
    font-size: 15px;
    color: var(--text-dark);
  }

  .row .row-desc{
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .row .row-arrow{
    font-family: var(--font-mono);
    color: var(--text-muted);
    font-size: 18px;
  }

  footer.site{
    text-align:center;
    padding: 30px 24px 46px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    background: #fff;
  }

</style>
</head>
<body>

<header class="hero">

  <!-- gotas y burbujas decorativas, con animación de flotado -->
  <div class="deco drop d1"></div>
  <div class="deco drop d2"></div>
  <div class="deco bubble b1"></div>
  <div class="deco bubble b2"></div>

  <div class="hero-top">
    <div class="logo">
      <img src="assets/logo-icono.png" alt="Aguakan" style="width:34px; height:34px; object-fit:contain;">
      <span class="logo-text">AGUAKAN</span>
    </div>
    <div class="btn-stack">
      <a class="btn-pill" href="https://github.com/IchanBCE/BI-Aguakan" target="_blank" rel="noopener">Ver repositorio</a>
      <a class="btn-pill secondary" href="contacto.html">Contacto</a>
    </div>
  </div>

  <div class="hero-body">
    <h1 class="headline">
      <span class="line1">PLATAFORMA DE</span>
      <span class="line2">DASHBOARDS</span>
    </h1>
    <p class="sub">Repositorio central de reportes de cobranza, zonas, convenios y saldos.</p>

    <!-- Contadores generales (Fase 5) — se llenan solos leyendo manifest.json -->
    <div class="stats">
      <div class="stat"><b id="stat-total">–</b><span>Dashboards</span></div>
      <div class="stat"><b id="stat-meses">–</b><span>Meses activos</span></div>
    </div>

    <span class="by-line">BI · Aguakan</span>
  </div>
</header>

<main class="panel">

  <div class="month-select-wrap">
    <div class="mes-grupo">
      <span class="label">Mes:</span>
      <!-- Este <select> se llena solo con JavaScript, leyendo
           manifest.json. Ya no se edita a mano. -->
      <select class="month-select" id="month-picker"></select>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="buscador" class="search-input" placeholder="Buscar por nombre o tag…">
    </div>
  </div>

  <!-- Aviso de resultados de búsqueda (oculto salvo cuando hay texto en el buscador) -->
  <p id="search-info" class="search-info" style="display:none;"></p>

  <!-- Aquí se inyecta el contenido de cada mes (generado por JS) -->
  <div id="contenido-meses">
    <p id="estado-carga" style="color:var(--text-muted); font-size:14px;">Cargando dashboards…</p>
  </div>

  <!-- Resultados del buscador (Fase 5) — oculto salvo cuando hay texto escrito -->
  <div id="resultados-busqueda" style="display:none;"></div>

</main>

<footer class="site">BI-Aguakan · repositorio interno de dashboards <span id="ultima-actualizacion"></span></footer>

<script>
  // ============================================================
  // FASE 3 — index.html dinámico
  // Ya no hay dashboards escritos a mano aquí. Este script:
  //   1) descarga manifest.json (lo genera solo el GitHub Action)
  //   2) agrupa los dashboards por mes y por categoría
  //   3) arma el <select> de meses y las tarjetas de cada uno
  // Si mañana subes un dashboard nuevo con su bloque de
  // metadatos en la carpeta correcta, aparece aquí solo —
  // no hay que tocar este archivo para nada.
  // ============================================================

  const NOMBRES_MES = [
    'Enero','Febrero','Marzo','Abril','Mayo','Junio',
    'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'
  ];

  // Orden fijo en el que queremos mostrar las categorías.
  // Si aparece una categoría nueva que no está en esta lista,
  // se agrega al final automáticamente.
  const ORDEN_CATEGORIAS = ['Zonas', 'Saldos', 'Convenios', 'Varios'];

  const COLOR_CATEGORIA = {
    'Zonas':     'var(--cat-zonas)',
    'Saldos':    'var(--cat-saldos)',
    'Convenios': 'var(--cat-convenios)',
    'Varios':    'var(--cat-varios)'
  };

  function colorDeCategoria(categoria){
    return COLOR_CATEGORIA[categoria] || 'var(--blue-bright)';
  }

  // "2026-08-01" -> { year: 2026, monthIndex: 7 }
  // (se separa a mano el string para evitar líos de zona horaria)
  function parsearFecha(fechaTexto){
    const partes = fechaTexto.split('-').map(Number);
    return { year: partes[0], monthIndex: partes[1] - 1 };
  }

  function renderCategoria(categoria, dashboards){
    if (dashboards.length === 0) return '';

    const filas = dashboards.map(d => `
      <a class="row" href="${d.ruta}">
        <span class="bullet" style="background:${colorDeCategoria(categoria)}"></span>
        <span class="row-text">
          <span class="row-title">${d.titulo}</span>
          <span class="row-desc">${d.descripcion || ''}</span>
        </span>
        <span class="row-arrow">↗</span>
      </a>
    `).join('');

    const palabra = dashboards.length === 1 ? 'dashboard' : 'dashboards';

    return `
      <div class="cat-block">
        <div class="cat-heading">
          <span class="dot" style="background:${colorDeCategoria(categoria)}"></span>
          ${categoria}
          <span class="count">${dashboards.length} ${palabra}</span>
        </div>
        ${filas}
      </div>
    `;
  }

  async function iniciar(){
    const contenedor = document.getElementById('contenido-meses');
    const selector = document.getElementById('month-picker');

    let manifest;
    try{
      // { cache: 'no-store' } le dice al navegador que nunca use una
      // copia guardada de manifest.json, que siempre pida la más nueva.
      const respuesta = await fetch('manifest.json', { cache: 'no-store' });
      if (!respuesta.ok) throw new Error('No se encontró manifest.json');
      manifest = await respuesta.json();
    }catch(error){
      contenedor.innerHTML = `<p style="color:var(--text-muted); font-size:14px;">
        No se pudo cargar la lista de dashboards. Intenta recargar la página.
      </p>`;
      console.error(error);
      return;
    }

    // Agrupa los dashboards por mes (clave "AAAA-MM")
    const meses = {}; // { "2026-08": { etiqueta: "Agosto 2026", items: [...] } }

    manifest.dashboards.forEach(d => {
      const { year, monthIndex } = parsearFecha(d.fecha);
      const clave = `${year}-${String(monthIndex + 1).padStart(2, '0')}`;
      if (!meses[clave]){
        meses[clave] = { etiqueta: `${NOMBRES_MES[monthIndex]} ${year}`, items: [] };
      }
      meses[clave].items.push(d);
    });

    // Meses del más reciente al más antiguo
    const clavesOrdenadas = Object.keys(meses).sort().reverse();

    if (clavesOrdenadas.length === 0){
      contenedor.innerHTML = `<p style="color:var(--text-muted); font-size:14px;">
        Todavía no hay dashboards publicados.
      </p>`;
      return;
    }

    // Arma el <select> de meses
    selector.innerHTML = clavesOrdenadas
      .map(clave => `<option value="${clave}">${meses[clave].etiqueta}</option>`)
      .join('');

    // Arma el contenido de cada mes (todos ocultos salvo el más reciente)
    contenedor.innerHTML = clavesOrdenadas.map(clave => {
      const items = meses[clave].items;

      // Categorías en el orden fijo, más cualquier categoría extra al final
      const categoriasEncontradas = [...new Set(items.map(d => d.categoria))];
      const categoriasOrdenadas = [
        ...ORDEN_CATEGORIAS.filter(c => categoriasEncontradas.includes(c)),
        ...categoriasEncontradas.filter(c => !ORDEN_CATEGORIAS.includes(c))
      ];

      const bloques = categoriasOrdenadas
        .map(cat => renderCategoria(cat, items.filter(d => d.categoria === cat)))
        .join('');

      const activo = clave === clavesOrdenadas[0] ? 'active' : '';
      return `<div class="month-panel ${activo}" id="mes-${clave}">${bloques}</div>`;
    }).join('');

    // Cambiar de mes desde el dropdown
    selector.addEventListener('change', function(){
      document.querySelectorAll('.month-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('mes-' + this.value).classList.add('active');
    });

    // "Última actualización" en el pie de página
    const fechaGen = new Date(manifest.generado);
    const texto = fechaGen.toLocaleString('es-MX', {
      day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });
    document.getElementById('ultima-actualizacion').textContent = `· Actualizado: ${texto}`;

    // ---------- Contadores generales (Fase 5) ----------
    document.getElementById('stat-total').textContent = manifest.dashboards.length;
    document.getElementById('stat-meses').textContent = clavesOrdenadas.length;

    // ---------- Buscador por nombre o tag (Fase 5) ----------
    const buscador = document.getElementById('buscador');
    const resultados = document.getElementById('resultados-busqueda');
    const infoResultados = document.getElementById('search-info');

    buscador.addEventListener('input', function(){
      const q = this.value.trim().toLowerCase();

      if (q === ''){
        // Sin búsqueda: se ve el modo normal por mes
        resultados.style.display = 'none';
        resultados.innerHTML = '';
        infoResultados.style.display = 'none';
        contenedor.style.display = '';
        return;
      }

      const encontrados = manifest.dashboards.filter(d => {
        const enTitulo = d.titulo?.toLowerCase().includes(q);
        const enDescripcion = d.descripcion?.toLowerCase().includes(q);
        const enTags = (d.tags || []).some(t => t.toLowerCase().includes(q));
        return enTitulo || enDescripcion || enTags;
      });

      // Modo búsqueda: se oculta la vista por mes y se muestran los resultados
      contenedor.style.display = 'none';

      infoResultados.style.display = 'block';
      infoResultados.textContent = encontrados.length === 0
        ? `Sin resultados para "${this.value}".`
        : `${encontrados.length} resultado(s) para "${this.value}" (de todos los meses):`;

      if (encontrados.length === 0){
        resultados.style.display = 'block';
        resultados.innerHTML = '';
        return;
      }

      const categoriasEnResultados = [...new Set(encontrados.map(d => d.categoria))];
      const categoriasOrdenadas = [
        ...ORDEN_CATEGORIAS.filter(c => categoriasEnResultados.includes(c)),
        ...categoriasEnResultados.filter(c => !ORDEN_CATEGORIAS.includes(c))
      ];

      resultados.style.display = 'block';
      resultados.innerHTML = categoriasOrdenadas
        .map(cat => renderCategoria(cat, encontrados.filter(d => d.categoria === cat)))
        .join('');
    });
  }

  iniciar();
</script>

</body>
</html>
