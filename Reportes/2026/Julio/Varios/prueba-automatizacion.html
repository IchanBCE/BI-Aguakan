<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba de Automatización</title>

<!-- ============================================================
     Este es un dashboard de PRUEBA. No tiene datos reales, solo
     sirve para confirmar que subir un archivo aquí hace que
     aparezca solo en la página principal, en el mes y categoría
     correctos, sin tocar nada más. Se puede borrar después.
     ============================================================ -->

<script type="application/json" id="meta">
{
  "titulo": "Prueba de Automatización",
  "categoria": "Varios",
  "fecha": "2026-07-15",
  "descripcion": "Dashboard de prueba para validar que el sistema automático funciona de punta a punta",
  "tags": ["Prueba", "Automatización"]
}
</script>

<style>
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: system-ui, sans-serif;
    background: linear-gradient(-45deg, #0A1E4A, #1650B9, #14B8A6, #7C6FF0);
    background-size: 400% 400%;
    animation: fondoMovil 12s ease infinite;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    position: relative;
  }

  @keyframes fondoMovil{
    0%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
    100%{ background-position: 0% 50%; }
  }

  h1{
    font-size: clamp(28px, 5vw, 48px);
    text-align: center;
    margin: 0 0 8px;
    animation: pulso 2s ease-in-out infinite;
  }

  @keyframes pulso{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.04); }
  }

  p.sub{ opacity: .85; margin: 0 0 50px; }

  /* --- burbujas flotantes de fondo --- */
  .burbuja{
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.05));
    animation: flotar linear infinite;
    pointer-events: none;
  }
  @keyframes flotar{
    0%   { transform: translateY(0) translateX(0) rotate(0deg); }
    50%  { transform: translateY(-40px) translateX(20px) rotate(180deg); }
    100% { transform: translateY(0) translateX(0) rotate(360deg); }
  }

  /* --- tarjetas girando --- */
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 24px;
    max-width: 760px;
    width: 100%;
    margin-bottom: 50px;
  }

  .cubo{
    aspect-ratio: 1;
    border-radius: 20px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 800;
    animation: girar 5s linear infinite;
  }
  .cubo:nth-child(2){ animation-duration: 4s; animation-direction: reverse; }
  .cubo:nth-child(3){ animation-duration: 6s; }
  .cubo:nth-child(4){ animation-duration: 3.5s; animation-direction: reverse; }

  @keyframes girar{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }

  /* --- barra de progreso animada --- */
  .barra-wrap{
    width: 100%;
    max-width: 460px;
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
    height: 14px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .barra{
    height: 100%;
    width: 30%;
    border-radius: 999px;
    background: linear-gradient(90deg, #5EEAFB, #14B8A6);
    animation: cargar 2.4s ease-in-out infinite;
  }
  @keyframes cargar{
    0%   { width: 10%; margin-left: 0%; }
    50%  { width: 60%; margin-left: 20%; }
    100% { width: 10%; margin-left: 90%; }
  }

  /* --- pelotitas rebotando --- */
  .pelotas{ display:flex; gap: 14px; margin-top: 40px; }
  .pelota{
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #5EEAFB;
    animation: rebotar 0.9s ease-in-out infinite;
  }
  .pelota:nth-child(2){ animation-delay: .15s; background:#14B8A6; }
  .pelota:nth-child(3){ animation-delay: .3s;  background:#7C6FF0; }
  .pelota:nth-child(4){ animation-delay: .45s; background:#fff; }

  @keyframes rebotar{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(-22px); }
  }

  footer{
    margin-top: 60px;
    font-size: 12px;
    opacity: .6;
    text-align: center;
  }
</style>
</head>
<body>

  <!-- burbujas de fondo, posicionadas y animadas con distinta duración -->
  <div class="burbuja" style="width:70px; height:70px; top:8%; left:8%; animation-duration:7s;"></div>
  <div class="burbuja" style="width:40px; height:40px; top:15%; right:12%; animation-duration:5s;"></div>
  <div class="burbuja" style="width:110px; height:110px; bottom:10%; left:15%; animation-duration:9s;"></div>
  <div class="burbuja" style="width:55px; height:55px; bottom:20%; right:10%; animation-duration:6.5s;"></div>
  <div class="burbuja" style="width:25px; height:25px; top:45%; left:4%; animation-duration:4s;"></div>

  <h1>🚀 Prueba de Automatización</h1>
  <p class="sub">Si estás viendo esto en la página principal, el sistema funciona solo.</p>

  <div class="grid">
    <div class="cubo">✅</div>
    <div class="cubo">🔄</div>
    <div class="cubo">📊</div>
    <div class="cubo">💧</div>
  </div>

  <div class="barra-wrap"><div class="barra"></div></div>
  <p class="sub" style="margin:0 0 0;">Simulando carga…</p>

  <div class="pelotas">
    <div class="pelota"></div>
    <div class="pelota"></div>
    <div class="pelota"></div>
    <div class="pelota"></div>
  </div>

  <footer>Este dashboard es solo de prueba — Julio 2026 · Varios</footer>

</body>
</html>
