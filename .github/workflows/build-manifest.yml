# ============================================================
# build-manifest.yml
#
# Qué hace: cada vez que subes o cambias un archivo dentro de
# Reportes/, GitHub ejecuta este workflow. Este corre el script
# generar-manifest.js y guarda el manifest.json actualizado de
# vuelta en el repositorio, automáticamente.
#
# También se puede correr a mano desde la pestaña "Actions" del
# repositorio (útil para generar el primer manifest.json).
# ============================================================

name: Generar manifest.json

on:
  push:
    branches: [main]
    paths:
      - 'Reportes/**/*.html'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar manifest.json
        run: node scripts/generar-manifest.js

      - name: Guardar manifest.json en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Actualizar manifest.json automáticamente"
          git push
